data:
  strict_rows: 5000
selection:
  methods: [utl, pm, ha]
  budgets: [100, 200, 300, 400, 500, 750, 1000, 1500, 2000]
  seeds: [0, 1, 2]
  utl_draws: 2
  score_packet: exact_symmetric_average
  target_candidate_pool_size: 2000
  utl_candidate_pool: panel
training:
  packet: single_prerealized_uniform
  endpoint_initialization: common_pretrained
  beta: 0.1
  epochs: 1
  learning_rate: 1.0e-5
  batch_size: 4
  gradient_accumulation: 4
  optimizer: adamw_torch_fused
  scheduler: cosine
  warmup_ratio: 0.1
  max_gradient_norm: 1.0
  gradient_checkpointing: true
  max_sequence_length: 1024
model:
  id: meta-llama/Llama-3.2-1B-Instruct
  revision: 9213176726f574b556790deb65791e0c5aa438b6
  arithmetic: unquantized_bf16
  attention: flash_attention_2
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
scoring:
  selection_probe_size: 500
  probe_batch_size: 2
  ggn_rows: 1000
  ggn_dtype: bf16
  ggn_damping_fraction: 0.05
  ggn_solve_tolerance: 1.0e-4
evaluation:
  batch_size: 4
  environments: [P, Q_clean, Q_adv]
  headline: strict_dpo_implicit_reward_causal_accuracy_Q_adv
  energy_anchors: 1000
  energy_redraws: 4
