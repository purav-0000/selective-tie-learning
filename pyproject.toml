[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-tie-learning"
version = "0.1.0"
description = "Selective tie learning experiments for linear, nonlinear, and LLM DPO"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.11.0",
  "numpy==2.5.0",
  "PyYAML==6.0.3",
  "scipy==1.18.0",
  "torch==2.12.1",
  "tqdm==4.68.4",
]

[project.optional-dependencies]
llm = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "peft==0.19.1",
  "transformers==5.13.0",
  "trl==1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]
